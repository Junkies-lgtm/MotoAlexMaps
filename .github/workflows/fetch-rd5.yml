name: BRouter rd5-Kacheln aktualisieren

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch: {}

concurrency:
  group: rd5-fetch
  cancel-in-progress: false

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: rd5-Kacheln herunterladen
        run: python scripts/fetch_rd5_germany.py --output-dir rd5-output

      - name: Ergebnis als Artifact sichern
        uses: actions/upload-artifact@v4
        with:
          name: rd5-germany
          path: |
            rd5-output/*.rd5
            rd5-output/fetch_rd5_germany.log
          retention-days: 14

      - name: Release aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-rd5
          name: "BRouter Offline-Kacheln Deutschland (automatisch aktualisiert)"
          body: |
            Automatisch aktualisiert. Quelle: https://brouter.de/brouter/segments4/
            Kacheln: E5_N45, E5_N50, E5_N55, E10_N45, E10_N50, E15_N50
          files: |
            rd5-output/*.rd5
